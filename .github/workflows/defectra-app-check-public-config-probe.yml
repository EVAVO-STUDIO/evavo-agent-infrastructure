name: Defectra Expo public metadata probe

on:
  push:
    branches:
      - agent/defectra-app-check-public-config-probe-20260811

permissions:
  contents: read

env:
  DEFECTRA_EAS_PROJECT_ID: de9cd3cb-bf98-4cfa-aeb0-f21635b57378

jobs:
  probe:
    name: Probe Expo public project and build schema
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query Expo GraphQL public metadata
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';

          const endpoint = 'https://api.expo.dev/graphql';
          async function graphql(name, query, variables = {}) {
            let response;
            let text = '';
            try {
              response = await fetch(endpoint, {
                method: 'POST',
                headers: {
                  Accept: 'application/json',
                  'Content-Type': 'application/json',
                  'Expo-Client-Platform': 'github-actions',
                },
                body: JSON.stringify({ operationName: name, query, variables }),
                cache: 'no-store',
              });
              text = await response.text();
            } catch (error) {
              return { name, status: 'network-error', error: String(error?.message ?? error).slice(0, 400) };
            }
            let payload = null;
            try { payload = text ? JSON.parse(text) : null; } catch {}
            return {
              name,
              status: response.status,
              ok: response.ok,
              contentType: response.headers.get('content-type'),
              payload: payload ?? { bodyPreview: text.replace(/\s+/gu, ' ').slice(0, 800) },
            };
          }

          const app = await graphql(
            'DefectraPublicApp',
            `query DefectraPublicApp($appId: String!) {
              app {
                byId(appId: $appId) {
                  id
                  name
                  fullName
                  slug
                  ownerAccount { id name }
                  githubRepository {
                    id
                    metadata { id githubRepoOwnerName githubRepoName }
                  }
                }
              }
            }`,
            { appId: process.env.DEFECTRA_EAS_PROJECT_ID },
          );

          const schema = await graphql(
            'DefectraPublicSchema',
            `query DefectraPublicSchema {
              appQuery: __type(name: "AppQuery") {
                name
                fields {
                  name
                  args { name type { kind name ofType { kind name } } }
                  type { kind name ofType { kind name } }
                }
              }
              appType: __type(name: "App") {
                name
                fields {
                  name
                  args { name type { kind name ofType { kind name } } }
                  type { kind name ofType { kind name } }
                }
              }
              buildType: __type(name: "Build") {
                name
                fields {
                  name
                  args { name type { kind name ofType { kind name } } }
                  type { kind name ofType { kind name } }
                }
              }
            }`,
          );

          const report = {
            schema: 'defectra_expo_public_metadata_probe_v1',
            projectId: process.env.DEFECTRA_EAS_PROJECT_ID,
            app,
            schemaResult: schema,
          };
          writeFileSync('defectra-expo-public-metadata.json', `${JSON.stringify(report, null, 2)}\n`, { mode: 0o600 });
          console.log(JSON.stringify(report, null, 2));
          if (!app.ok) process.exitCode = 1;
          NODE

      - name: Upload bounded Expo metadata result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: defectra-expo-public-metadata
          path: defectra-expo-public-metadata.json
          if-no-files-found: error
          retention-days: 1
