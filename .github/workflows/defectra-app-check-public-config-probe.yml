name: Defectra public App Check configuration probe

on:
  push:
    branches:
      - agent/defectra-app-check-public-config-probe-20260811

permissions:
  contents: read

env:
  DEFECTRA_FIREBASE_API_KEY: AIzaSyAPMEwjTr1Az0YU0YPKReiX5nYHe3Xt_rQ
  DEFECTRA_FIREBASE_PROJECT_ID: defectra-fa684
  DEFECTRA_FIREBASE_PROJECT_NUMBER: "784337791023"
  DEFECTRA_FIREBASE_AUTH_DOMAIN: defectra-fa684.firebaseapp.com
  DEFECTRA_FIREBASE_APP_ID: 1:784337791023:web:7e20b6c984aa9b9bba7eda
  DEFECTRA_FIREBASE_SENDER_ID: "784337791023"
  PROBE_PUBLIC_KEY: |
    -----BEGIN PUBLIC KEY-----
    MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAm332XZnNKlNWv0JuCVho
    vX1bN+sQEbQVMYZoqZj7YFKdtpPr/s/YnXEfVYMgcQPrdCs0ZXOKf/VkYMItrmMP
    0Ndn8HqX7qTGqhldPvhKUvmo4ZQ4/Hve+nvu/G2Zi1y4Yc34IbNYb0Uqm+Q70750
    kuoCHw8lN0nIEgRalThwJErjtbn4i89gil/0rcOLOPl4a7s61+PID8x1oTSTTY+h
    RmaFYe/bLv9d/jxzslcpMsnqPYhFK2Ot1QeghZHw1C+L+UKZKQ/4Fq/xGP/+zzd4
    MSTgBpiEI6Yxw0ZXglDZhf2tWLhHS4eUExjv4B+PJEAVZ6UpUoPtNsesvqsWlWrx
    wwIDAQAB
    -----END PUBLIC KEY-----

jobs:
  probe:
    name: Probe official public configuration surfaces
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe exact Defectra Firebase web configuration
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const { createHash, constants, publicEncrypt } = require('node:trypto');
          const { writeFileSync } = require('node:fs');

          const expected = Object.freeze({
            projectId: process.env.DEFECTRA_FIREBASE_PROJECT_ID,
            projectNumber: process.env.DEFECTRA_FIREBASE_PROJECT_NUMBER,
            authDomain: process.env.DEFECTRA_FIREBASE_AUTH_DOMAIN,
            appId: process.env.DEFECTRA_FIREBASE_APP_ID,
            messagingSenderId: process.env.DEFECTRA_FIREBASE_SENDER_ID,
            apiKey: process.env.DEFECTRA_FIREBASE_API_KEY,
          });

          const app = encodeURIComponent(expected.appId);
          const key = encodeURIComponent(expected.apiKey);
          const endpoints = [
            ['firebase-web-app-config', `https://firebase.googleapis.com/v1beta1/projects/-/webApps/${app}/config?key=${key}`],
            ['firebase-hosting-init', `https://${expected.authDomain}/__/firebase/init.json`],
            ['appcheck-v1-enterprise-query-key', `https://firebaseappcheck.googleapis.com/v1/projects/${expected.projectNumber}/apps/${app}/recaptchaEnterpriseConfig?key=${key}`],
            ['appcheck-v1beta-enterprise-query-key', `https://firebaseappcheck.googleapis.com/v1beta/projects/${expected.projectNumber}/apps/${app}/recaptchaEnterpriseConfig?key=${key}`],
            ['appcheck-v1-enterprise-header-key', `https://firebaseappcheck.googleapis.com/v1/projects/${expected.projectNumber}/apps/${app}/recaptchaEnterpriseConfig`],
            ['appcheck-v1beta-enterprise-header-key', `https://firebaseappcheck.googleapis.com/v1beta/projects/${expected.projectNumber}/apps/${app}/recaptchaEnterpriseConfig`],
            ['appcheck-v1-v3-query-key', `https://firebaseappcheck.googleapis.com/v1/projects/${expected.projectNumber}/apps/${app}/recaptchaV3Config?key=${key}`],
            ['appcheck-v1beta-v3-query-key', `https://firebaseappcheck.googleapis.com/v1beta/projects/${expected.projectNumber}/apps/${app}/recaptchaV3Config?key=${key}`],
            ['recaptcha-enterprise-list-query-key', `https://recaptchaenterprise.googleapis.com/v1/projects/${expected.projectId}/keys?pageSize=1000&key=${key}`],
          ];

          const redact = (value) => String(value ?? '')
            .replace(/AIza[0-9A-Za-z_-]{20,}/g, '[firebase-api-key]')
            .replace(/6L[0-9A-Za-zz_-]{20,}/g, '[recaptcha-site-key]');

          function collectSiteKeys(value, path = '$', found = []) {
            if (typeof value === 'string') {
              const direct = value.trim();
              if (/^6L[0-9A-Za-z-]{20,}$/.test(direct)) found.push({ path, value: direct });
              const resource = direct.match(/(?:^|\\/)keys\\/(6L[0-9A-Za-z-]{20,})$/);
              if (resource) found.push({ path, value: resource[1] });
              return found;
            }
            if (Array.isArray(value)) {
              value.forEach((entry, index) => collectSiteKeys(entry, `${path}[${index}]`, found));
              return found;
            }
            if (value && typeof value === 'object') {
              for (const [name, entry] of Object.entries(value)) {
                collectSiteKeys(entry, `${path}.${name}`, found);
              }
            }
            return found;
          }

          function identityCompatible(payload) {
            if (!payload || typeof payload !== 'object') return true;
            const checks = [
              ['projectId', expected.projectId],
              ['appId', expected.appId],
              ['messagingSenderId', expected.messagingSenderId],
              ['apiKey', expected.apiKey],
            ];
            for (const [name, wanted] of checks) {
              if (typeof payload[name] === 'string' && payload[name] !== wanted) return false;
            }
            if (typeof payload.name === 'string') {
              const decoded = decodeURIComponent(payload.name);
              if (decoded.includes('/apps/') && !decoded.includes(expected.appId)) return false;
              if (decoded.includes('/projects/') && !decoded.includes(expected.projectNumber) && !decoded.includes(expected.projectId)) return false;
            }
            return true;
          }

          const diagnostics = [];
          const candidates = [];
          for (const [name, url] of endpoints) {
            const headers = { Accept: 'application/json', 'x-goog-api-key': expected.apiKey };
            let response;
            let text = '';
            try {
              response = await fetch(url, { method: 'GET', headers, cache: 'no-store', redirect: 'follow' });
              text = await response.text();
            } catch (error) {
              diagnostics.push({ name, status: 'network-error', error: redact(error?.message).slice(0, 400) });
              continue;
            }

            let payload = null;
            try { payload = text ? JSON.parse(text) : null; } catch {}
            const fields = payload && typeof payload === 'object' ? Object.keys(payload).sort() : [];
            const bodyDigest = createHash('sha256').update(text).digest('hex');
            diagnostics.push({
              name,
              status: response.status,
              ok: response.ok,
              contentType: response.headers.get('content-type'),
              fields,
              bodySha256: bodyDigest,
              bodyPreview: response.ok ? undefined : redact(text).replace(/\\s+/g, ' ').slice(0, 500),
            });

            if (!response.ok || !identityCompatible(payload)) continue;
            for (const candidate of collectSiteKeys(payload)) {
              candidates.push({ endpoint: name, path: candidate.path, value: candidate.value });
            }
          }

          const unique = [...new Map(candidates.map((candidate) => [candidate.value, candidate])).values()];
          const report = {
            schema: 'defectra_app_check_public_config_probe_v2',
            projectId: expected.projectId,
            projectNumber: expected.projectNumber,
            appId: expected.appId,
            diagnostics,
            candidateCount: unique.length,
          };

          if (unique.length === 1) {
            const siteKey = unique[0].value;
            const digest = createHash('sha256').update(siteKey).digest('hex');
            const ciphertext = publicEncrypt(
              {
                key: process.env.PROBE_PUBLIC_KEY,
                padding: constants.RSA_PKCS1_OAEP_PADDING,
                oaepHash: 'sha256',
              },
              Buffer.from(siteKey, 'utf8')
            ).toString('base64');
            report.siteKeySha256 = digest;
            report.source = { endpoint: unique[0].endpoint, path: unique[0].path };
            report.ciphertext = ciphertext;
            console.log(`Resolved one exact browser-public App Check identity (sha256 ${digest.slice(0, 12)}…).`);
          } else if (unique.length > 1) {
            report.failure = 'Multiple distinct registered-shaped site keys were returned by exact public surfaces.';
          } else {
            report.failure = 'No registered-shaped site key was returned by the official public surfaces.';
          }

          writeFileSync('defectra-app-check-public-config-probe.json', `${JSON.stringify(report, null, 2)}\n`, { mode: 0o600 });
          console.log(JSON.stringify({ candidateCount: unique.length, diagnostics }, null, 2));
          if (unique.length !== 1) process.exitCode = 1;
          NODE

      - name: Upload bounded probe result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: defectra-app-check-public-config-probe
          path: defectra-app-check-public-config-probe.json
          if-no-files-found: error
          retention-days: 1
